{% extends 'base.html' %}
{% block content %}
  <div class="form-shell">
    <div class="icon-badge-lg" style="background:var(--current-dim); color:var(--current);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg>
    </div>
    <span class="eyebrow">Access</span>
    <h2 class="text-2xl font-semibold mt-2 mb-1">Sign in</h2>
    <p class="text-sm mb-4" style="color:var(--text-dim);">Enter your credentials to open the control panel.</p>

    <svg class="wave-divider" viewBox="0 0 400 20" preserveAspectRatio="none">
      <path d="M0,10 C16.7,2 33.3,2 50,10 C66.7,18 83.3,18 100,10 C116.7,2 133.3,2 150,10 C166.7,18 183.3,18 200,10 C216.7,2 233.3,2 250,10 C266.7,18 283.3,18 300,10 C316.7,2 333.3,2 350,10 C366.7,18 383.3,18 400,10"/>
    </svg>

    <div class="panel p-6">
      <form method="post" class="panel-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-current btn-block mt-2">Sign In</button>
      </form>
    </div>
  </div>
{% endblock %}
