{% extends 'base.html' %}
{% block content %}
  <div class="max-w-md mx-auto mt-12 bg-white p-6 rounded shadow">
    <h2 class="text-xl font-bold mb-4">Register Cycle</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="mt-4 px-4 py-2 bg-green-600 text-white rounded">Save</button>
    </form>
  </div>
{% endblock %}
