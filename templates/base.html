<!doctype html>
<html>
{% load static %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Electricity Monitor{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="{% static 'src/styles.css' %}">
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
</head>
<body>
  <nav class="topbar">
    <div class="max-w-6xl mx-auto px-5 py-3.5 flex justify-between items-center">
      <a href="/" class="flex items-center gap-3">
        <span class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/></svg>
        </span>
        <span class="flex flex-col leading-none">
          <span class="brand-word">Electricity Monitor</span>
          <span class="brand-tag">Control Panel</span>
        </span>
      </a>
      <div class="flex items-center gap-3">
        <span class="live-pill"><span class="pulse-dot"></span>Live</span>
        {% if user.is_authenticated %}
          <a href="/dashboard/" class="nav-link">Dashboard</a>
          <a href="/screens/" class="nav-link">Screens</a>
          <a href="/admin/" class="nav-link">Admin</a>
          <a href="/logout/" class="nav-link">Logout</a>
        {% else %}
          <a href="/login/" class="nav-link">Login</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="max-w-6xl mx-auto px-5 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
