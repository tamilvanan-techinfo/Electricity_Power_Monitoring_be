<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Electricity Monitoring{% endblock %}</title>
  <!-- Tailwind CDN for quick development -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900">
  <nav class="bg-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="/" class="font-bold">Electricity Monitor</a>
      <div class="space-x-4">
        {% if user.is_authenticated %}
          <a href="/dashboard/" class="text-sm">Dashboard</a>
          <a href="/admin/" class="text-sm">Admin</a>
          <a href="/logout/" class="text-sm">Logout</a>
        {% else %}
          <a href="/login/" class="text-sm">Login</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="max-w-4xl mx-auto p-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
