{% extends 'base.html' %}
{% block content %}
  <div class="form-shell">
    <div class="icon-badge-lg" style="background:var(--violet-dim); color:var(--violet);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="8" r="3.5"/><path d="M2.5 19.5c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16.5 5.5c1.6.3 2.8 1.7 2.8 3.4 0 1.5-.9 2.8-2.2 3.2"/><path d="M18 14c2 .5 3.5 2.2 3.5 4.6"/>
      </svg>
    </div>
    <span class="eyebrow tone-violet">New Participant</span>
    <h2 class="text-2xl font-semibold mt-2 mb-1">Register participant</h2>
    <p class="text-sm mb-4" style="color:var(--text-dim);">Add someone to the roster so a cycle can be allocated to them.</p>

    <svg class="wave-divider" viewBox="0 0 400 20" preserveAspectRatio="none">
      <path d="M0,10 C16.7,2 33.3,2 50,10 C66.7,18 83.3,18 100,10 C116.7,2 133.3,2 150,10 C166.7,18 183.3,18 200,10 C216.7,2 233.3,2 250,10 C266.7,18 283.3,18 300,10 C316.7,2 333.3,2 350,10 C366.7,18 383.3,18 400,10" style="stroke:var(--violet);"/>
    </svg>

    <div class="panel p-6">
      <form method="post" enctype="multipart/form-data" class="panel-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-violet btn-block mt-2">Save Participant</button>
      </form>
    </div>
  </div>
{% endblock %}
