version: '3.8'

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electricity_monitoring_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
    networks:
      - power_monitoring_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Redis Service (Message Broker for Celery)
  redis:
    image: redis:7-alpine
    container_name: electricity_monitoring_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - power_monitoring_net
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electricity_monitoring_celery_worker
    command: celery -A celery_app worker --loglevel=info --concurrency=4
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
      - api
    networks:
      - power_monitoring_net
    restart: unless-stopped

  # Celery Beat Scheduler
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: electricity_monitoring_celery_beat
    command: celery -A celery_app beat --loglevel=info
    environment:
      - PYTHONUNBUFFERED=1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      - redis
      - api
    networks:
      - power_monitoring_net
    restart: unless-stopped

volumes:
  redis_data:
    driver: local

networks:
  power_monitoring_net:
    driver: bridge
